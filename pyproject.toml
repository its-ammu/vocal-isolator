[project]
name = "vocal-isolator"
version = "0.1.0"
description = "Isolate vocals from audio using Demucs v4"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "demucs>=4.0",
    "flask>=3.0",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
]

[project.optional-dependencies]
audio-separator = ["audio-separator[gpu]"]

[project.urls]
Repository = "https://github.com/its-ammu/vocal-isolator"
